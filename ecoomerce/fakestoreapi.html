<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market | Comfort Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .api-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            height: 100%;
        }
        .api-card:hover {
            border-color: #007bff;
            transform: translateY(-5px);
        }
        .img-container {
            background: white;
            padding: 20px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px 12px 0 0;
        }
        .img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">COMFORT<span class="text-primary">DESK</span></a>
            <div class="d-flex align-items-center">
                <a href="cart.html" class="nav-link position-relative me-3">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span id="globalCartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" style="font-size: 0.6rem;">0</span>
                </a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#marketNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Global <span class="text-primary">Marketplace</span></h1>
            <p class="text-secondary">Powered by FakeStoreAPI - Explore products beyond furniture.</p>
        </div>

        <div id="apiProductGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-secondary">Fetching external products...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Fetch data from FakeStoreAPI
        async function fetchMarketProducts() {
            const container = document.getElementById('apiProductGrid');
            try {
                const response = await fetch('https://fakestoreapi.com/products');
                const products = await response.json();
                
                container.innerHTML = ''; // Clear loader

                products.forEach(item => {
                    container.innerHTML += `
                        <div class="col">
                            <div class="card api-card">
                                <div class="img-container">
                                    <img src="${item.image}" alt="${item.title}">
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <span class="badge bg-secondary mb-2" style="width: fit-content; font-size: 0.7rem;">${item.category.toUpperCase()}</span>
                                    <h6 class="fw-bold text-white text-truncate">${item.title}</h6>
                                    <p class="text-primary fw-bold mb-3">$${item.price}</p>
                                    <button onclick="addToCart('${item.id}', '${item.title.replace(/'/g, "\\'")}', ${item.price}, '${item.image}')" 
                                            class="btn btn-primary btn-sm mt-auto rounded-pill">
                                        Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                updateBadge();
            } catch (error) {
                container.innerHTML = `<p class="text-danger text-center">Failed to load API data: ${error.message}</p>`;
            }
        }

        // 2. Add to Cart (Shared logic with your existing cart.html)
        window.addToCart = (id, name, price, image) => {
    let cart = JSON.parse(localStorage.getItem('chairCart')) || [];
    
    // Force the ID to a String to match Firestore behavior
    const stringId = String(id); 
    
    const existingIndex = cart.findIndex(item => String(item.id) === stringId);

    if (existingIndex > -1) {
        cart[existingIndex].quantity += 1;
    } else {
        cart.push({ 
            id: stringId, 
            name: name, 
            price: price, 
            image: image, 
            quantity: 1 
        });
    }

    localStorage.setItem('chairCart', JSON.stringify(cart));
    updateBadge(); // Updates the little number in the navbar
    alert(`${name} added to cart!`);
};

        function updateBadge() {
            const cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('globalCartCount').innerText = total;
        }

        fetchMarketProducts();
    </script>
</body>
</html>
