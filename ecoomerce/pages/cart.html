<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Comfort Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">COMFORT<span class="text-primary">DESK</span></a>
            <a href="product.html" class="btn btn-outline-secondary btn-sm rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Back to Chairs
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <h3 class="fw-bold mb-4">Shopping <span class="text-primary">Cart</span></h3>
                <div id="cartItemsList">
                    </div>
            </div>

            <div class="col-lg-4">
                <div class="card bg-black border-secondary p-4 rounded-4 sticky-top" style="top: 100px;">
                    <h5 class="fw-bold mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <span id="subtotalPrice" class="fw-bold">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-secondary">Shipping</span>
                        <span class="text-success fw-bold">FREE</span>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Total</span>
                        <span id="totalPrice" class="fs-5 fw-bold text-primary">$0.00</span>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termsCheck">
                        <label class="form-check-label small text-secondary" for="termsCheck">
                            I agree to the Terms and Conditions
                        </label>
                    </div>

                    <button id="checkoutBtn" class="btn btn-primary w-100 py-3 fw-bold rounded-pill" disabled>
                        PROCEED TO CHECKOUT
                    </button>
                    
                    <button onclick="clearFullCart()" class="btn btn-sm btn-outline-danger w-100 mt-3 rounded-pill border-0">
                        <i class="bi bi-trash3 me-1"></i> Clear Cart
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAeSNIxXzWSjjrI0FouZjQZIN2-6wH-a2Y",
            authDomain: "comfort-desk.firebaseapp.com",
            projectId: "comfort-desk",
            storageBucket: "comfort-desk.firebasestorage.app",
            messagingSenderId: "109687131068",
            appId: "1:109687131068:web:f42451da43c01ac5e479b9",
            measurementId: "G-ZJVVZYYNET"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- CORE CART LOGIC ---

        // Function to render the cart from LocalStorage
        window.renderCart = () => {
            const cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            const list = document.getElementById('cartItemsList');
            
            if (cart.length === 0) {
                list.innerHTML = `
                <div class="text-center py-5 border border-secondary border-dashed rounded-4">
                    <i class="bi bi-cart-x display-1 text-secondary"></i>
                    <p class="mt-3 text-secondary">Your cart is empty. Add some products!</p>
                    <a href="product.html" class="btn btn-primary rounded-pill mt-2">Browse Chairs</a>
                </div>`;
                document.getElementById('subtotalPrice').innerText = "$0.00";
                document.getElementById('totalPrice').innerText = "$0.00";
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, index) => {
                const itemPrice = parseFloat(item.price);
                total += itemPrice * item.quantity;
                
                return `
                <div class="row align-items-center mb-4 pb-4 border-bottom border-secondary">
                    <div class="col-3 col-md-2">
                        <div class="bg-white p-2 rounded">
                            <img src="${item.image}" class="img-fluid" alt="${item.name}" style="max-height: 80px; object-fit: contain;">
                        </div>
                    </div>
                    <div class="col-5 col-md-6">
                        <h6 class="fw-bold mb-0 text-truncate text-white">${item.name}</h6>
                        <p class="text-primary small fw-bold mb-0">$${itemPrice.toFixed(2)}</p>
                    </div>
                    <div class="col-4 text-end">
                        <div class="d-flex align-items-center justify-content-end mb-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${index}, -1)">-</button>
                            <span class="mx-3 fw-bold">${item.quantity}</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                        <button class="btn btn-sm text-danger border-0 bg-transparent" onclick="removeItem(${index})">
                            <i class="bi bi-trash"></i> Remove
                        </button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('subtotalPrice').innerText = `$${total.toFixed(2)}`;
            document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;
        };

        // --- UI UPDATERS ---

        window.updateQty = (index, change) => {
            let cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            cart[index].quantity += change;
            if (cart[index].quantity < 1) cart.splice(index, 1);
            localStorage.setItem('chairCart', JSON.stringify(cart));
            renderCart();
        };

        window.removeItem = (index) => {
            let cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('chairCart', JSON.stringify(cart));
            renderCart();
        };

        window.clearFullCart = () => {
            if(confirm("Are you sure you want to clear your cart?")) {
                localStorage.removeItem('chairCart');
                renderCart();
            }
        };

        // --- CHECKOUT LOGIC ---

        document.getElementById('termsCheck').addEventListener('change', function() {
            document.getElementById('checkoutBtn').disabled = !this.checked;
        });

        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            const cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            const user = auth.currentUser;

            if (!user) {
                alert("You must be logged in to checkout.");
                window.location.href = "login.html";
                return;
            }

            try {
                await addDoc(collection(db, "orders"), {
                    userId: user.uid,
                    customerEmail: user.email,
                    items: cart,
                    totalAmount: document.getElementById('totalPrice').innerText,
                    createdAt: new Date().toISOString(),
                    status: "Pending"
                });

                alert("Thank you! Your order has been placed.");
                localStorage.removeItem('chairCart');
                window.location.href = "dashboard.html"; 
            } catch (err) {
                console.error(err);
                alert("Error placing order: " + err.message);
            }
        });

        // Initialize view
        renderCart();
    </script>
</body>
</html>
