<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Comfort Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">COMFORT<span class="text-primary">DESK</span></a>
            <a href="product.html" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-2"></i>Back to Collection
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div id="detailContainer" class="row g-5 align-items-center">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 text-secondary">Loading product specifications...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeSNIxXzWSjjrI0FouZjQZIN2-6wH-a2Y",
            authDomain: "comfort-desk.firebaseapp.com",
            projectId: "comfort-desk",
            storageBucket: "comfort-desk.firebasestorage.app",
            messagingSenderId: "109687131068",
            appId: "1:109687131068:web:f42451da43c01ac5e479b9",
            measurementId: "G-ZJVVZYYNET"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Get ID from URL
        // This MUST be at the top of your detail.html script
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        console.log("Current Product ID:", productId); // Add this to debug!

        async function loadProductDetail() {
            const container = document.getElementById('detailContainer');

            if (!productId) {
                container.innerHTML = `<div class="col-12 text-center"><h2>No Product Selected</h2></div>`;
                return;
            }

            try {
                // Fetch the specific document from the "products" collection
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const product = docSnap.data();

                    // MAPPING DATA: Using the keys from your Firestore screenshot
                    const name = product.Product_Name || "Premium Chair";
                    const price = product.Price || "0";
                    const img = product.Product_Image || "https://via.placeholder.com/500";
                    const desc = product.Description || "No description available for this model.";

                    container.innerHTML = `
                        <div class="col-md-6 text-center">
                            <div class="p-4 bg-black rounded-4">
                                <img src="${img}" class="img-fluid" alt="${name}" style="max-height: 450px; object-fit: contain;">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h1 class="fw-bold text-white display-5 mb-2">${name}</h1>
                            <p class="text-primary fs-3 fw-bold mb-4">$${price}</p>
                            
                            <h5 class="text-secondary fw-bold">Specifications</h5>
                            <p class="text-white-50 lh-lg mb-5">${desc}</p>
    
                            <button onclick="addToCart('${docSnap.id}', '${name}', ${price}, '${img}')" 
                                    class="btn btn-primary btn-lg w-100 rounded-pill fw-bold py-3 shadow">
                                <i class="bi bi-cart-plus me-2"></i> ADD TO CART
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="col-12 text-center"><h2>Product not found in database.</h2></div>`;
                }
            } catch (error) {
                console.error("Error fetching detail:", error);
                container.innerHTML = `<div class="col-12 text-center text-danger">Error: ${error.message}</div>`;
            }
        }

        // Add to Cart Logic for the Detail Page
        window.addToCart = (id, name, price, image) => {
            let cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                cart[index].quantity += 1;
            } else {
                cart.push({ id, name, price, image, quantity: 1 });
            }
            localStorage.setItem('chairCart', JSON.stringify(cart));
            alert(`${name} added to cart!`);
        };

        loadProductDetail();
    </script>
</body>

</html>
