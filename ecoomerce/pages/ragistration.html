<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Comfort Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1e24, #0f0f13);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgb(0, 0, 0) !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <a href="../index.html" class="text-decoration-none">
                    <h2 class="fw-800 text-white">COMFORT<span class="text-primary">DESK</span></h2>
                </a>
            </div>

            <div class="auth-card">
                <h3 class="fw-bold mb-1">Create Account</h3>
                <p class="text-secondary small mb-4">Join the community of ergonomic excellence.</p>

                <form id="registerForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-dark">First Name</label>
                            <input type="text" id="fName" class="form-control py-2" placeholder="John" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-secondary">Last Name</label>
                            <input type="text" id="lName" class="form-control py-2" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-secondary">Email Address</label>
                        <input type="email" id="email" class="form-control py-2" placeholder="john@example.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" id="password" class="form-control py-2" placeholder="Min. 8 characters" required>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termsAgree" required>
                        <label class="form-check-label small text-secondary" for="termsAgree">
                            I agree to the <a href="info.html" class="text-primary text-decoration-none">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow">
                        START YOUR GRIND
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-secondary">
                        Already a member? 
                        <a href="login.html" class="text-primary text-decoration-none fw-bold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAeSNIxXzWSjjrI0FouZjQZIN2-6wH-a2Y",
        authDomain: "comfort-desk.firebaseapp.com",
        databaseURL: "https://comfort-desk-default-rtdb.firebaseio.com",
        projectId: "comfort-desk",
        appId: "1:109687131068:web:f42451da43c01ac5e479b9",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const firstName = document.getElementById('fName').value;
        const lastName = document.getElementById('lName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // 1. Create the Auth User
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // 2. Update Firebase Auth Profile (Display Name)
            await updateProfile(user, {
                displayName: `${firstName} ${lastName}`
            });

            // 3. Save User Data to Realtime Database
            await set(ref(db, 'users/' + user.uid), {
                firstName: firstName,
                lastName: lastName,
                email: email,
                createdAt: new Date().toISOString()
            });

            window.location.href = "dashboard.html";
        } catch (error) {
            alert(error.message);
        }
    });
</script>

</body>
</html>
