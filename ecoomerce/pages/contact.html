<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10 glass-card overflow-hidden">
            <div class="row">
                <div class="col-md-5 bg-primary p-5 text-black">
                    <h2 class="fw-bold">Get in Touch</h2>
                    <p class="mt-4">Have questions about a chair? Our ergonomics team is ready to help.</p>
                    <div class="mt-5">
                        <p>📍 123 Gaming Ave, Tech City</p>
                        <p>📧 support@comfortdesk.com</p>
                        <p>📞 +1 (555) 000-CHAIR</p>
                    </div>
                </div>
                <div class="col-md-7 p-5">
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="contactName" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="contactEmail" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea id="contactMsg" class="form-control bg-dark text-white border-secondary" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Send Message</button>
                    </form>
                    <div id="successMsg" class="mt-3 text-success d-none">Message sent successfully!</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="../js/contact.js"></script>    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
