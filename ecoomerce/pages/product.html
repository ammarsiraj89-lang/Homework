<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chairs Collection | Comfort Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary py-3">
    <div class="container">
        <a class="navbar-brand fw-800 fs-3" href="../index.html">
            COMFORT<span class="text-primary">DESK</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item px-2">
                    <a class="nav-link active" href="../index.html">Home</a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link" href="product.html">Collection</a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link" href="info.html">Support</a>
                </li>
                
                <li class="nav-item px-3">
                    <a href="cart.html" class="nav-link position-relative d-inline-block">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span id="globalCartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" style="font-size: 0.6rem;">
                            0
                        </span>
                    </a>
                </li>

                <li class="nav-item ms-lg-3">
                    <a id="navActionBtn" href="login.html" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                        Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<body class="bg-dark text-white">
<div class="container-fluid px-4 py-5">
    <div class="row g-4">
        <aside class="col-lg-3 col-xl-2">
            <div class="glass-card p-4 sticky-top" style="top: 100px;">
                <h5 class="fw-bold mb-4 text-primary">Filters</h5>
                
                <div class="mb-4">
                    <label class="form-label small text-secondary fw-bold">SEARCH</label>
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control bg-dark text-white border-secondary" placeholder="Find a chair...">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small text-secondary fw-bold">CATEGORY</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="Gaming" id="cat1" checked>
                        <label class="form-check-label small" for="cat1">Gaming</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="Office" id="cat2" checked>
                        <label class="form-check-label small" for="cat2">Office</label>
                    </div>
                </div>

                <div>
                    <label class="form-label small text-secondary fw-bold">PRICE RANGE</label>
                    <input type="range" class="form-range" min="100" max="1000" id="priceRange">
                    <div class="d-flex justify-content-between small text-secondary">
                        <span>$100</span>
                        <span id="priceVal">$1000</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="col-lg-9 col-xl-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Our <span class="text-primary">Collection</span></h2>
                <select class="form-select bg-dark text-white border-secondary w-auto shadow-sm">
                    <option>Newest Arrivals</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                </select>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="catalogGrid">
                <div class="col text-center py-5 w-100">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module" src="../js/products-engine.js"></script>
</body>
</html>
