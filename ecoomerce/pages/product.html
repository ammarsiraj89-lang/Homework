<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection | Comfort Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.2);
        }
        .filter-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">
                COMFORT<span class="text-primary">DESK</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#comfortNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="comfortNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item px-2"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item px-2"><a class="nav-link active" href="product.html">Chairs</a></li>
                    <li class="nav-item px-2"><a class="nav-link" href="info.html">Support</a></li>
                    <li class="nav-item px-3">
                        <a href="cart.html" class="nav-link position-relative">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span id="globalCartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" style="font-size: 0.6rem;">0</span>
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a id="navActionBtn" href="login.html" class="btn btn-primary rounded-pill px-4 fw-bold">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5 px-lg-5">
        <div class="row g-4">
            
            <aside class="col-lg-3">
                <div class="filter-section p-4 sticky-top" style="top: 100px; z-index: 1;">
                    <h5 class="fw-bold mb-4"><i class="bi bi-sliders me-2"></i>Filters</h5>
                    <div class="mb-4">
                        <label class="form-label small text-secondary fw-bold">SEARCH</label>
                        <input type="text" id="chairSearch" class="form-control bg-dark text-white border-secondary" placeholder="Search by name...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary fw-bold">MAX PRICE</label>
                        <input type="range" class="form-range" min="100" max="5000" step="100" id="priceFilter" value="5000">
                        <div class="text-primary fw-bold text-end" id="priceDisplay">$5000</div>
                    </div>
                </div>
            </aside>

            <main class="col-lg-9">
                <h2 class="fw-bold mb-4">Our <span class="text-primary">Collection</span></h2>
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="productContainer">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-secondary">Loading Products...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeSNIxXzWSjjrI0FouZjQZIN2-6wH-a2Y",
            authDomain: "comfort-desk.firebaseapp.com",
            projectId: "comfort-desk",
            storageBucket: "comfort-desk.firebasestorage.app",
            messagingSenderId: "109687131068",
            appId: "1:109687131068:web:f42451da43c01ac5e479b9",
            measurementId: "G-ZJVVZYYNET"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. LOAD PRODUCTS FROM FIRESTORE
        async function loadProducts() {
            const container = document.getElementById('productContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = ''; 

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    const id = doc.id;
                    const img = product.Product_Image || 'https://via.placeholder.com/300';
                    const name = product.Product_Name || 'Untitled Chair';
                    const price = product.Price || 0;

                    container.innerHTML += `
                        <div class="col">
                            <div class="card product-card h-100 bg-transparent overflow-hidden">
                                <div class="p-3 bg-black text-center">
                                    <img src="${img}" class="card-img-top" alt="${name}" style="height: 200px; object-fit: contain;">
                                </div>
                                <div class="card-body p-4 bg-dark">
                                    <h5 class="fw-bold text-white mb-1">${name}</h5>
                                    <p class="text-primary fw-bold fs-5 mb-3">$${price}</p>
                                    <button onclick="addToCart('${id}', '${name}', ${price}, '${img}')" 
                                            class="btn btn-outline-primary w-100 rounded-pill fw-bold">
                                        ADD TO CART
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                updateCartBadge();
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
            }
        }

        // 2. ADD TO CART LOGIC
        window.addToCart = (id, name, price, image) => {
            let cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            const index = cart.findIndex(item => item.id === id);

            if (index > -1) {
                cart[index].quantity += 1;
            } else {
                cart.push({ id, name, price, image, quantity: 1 });
            }

            localStorage.setItem('chairCart', JSON.stringify(cart));
            updateCartBadge();
            alert(`${name} added to cart!`);
        };

        // 3. UI HELPER: Update Navbar Badge
        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('chairCart')) || [];
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('globalCartCount').innerText = total;
        }

        loadProducts();
    </script>
</body>
</html>
