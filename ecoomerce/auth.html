<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 glass-card p-4">
            <h2 id="authTitle" class="text-center mb-4">Login</h2>
            <form id="authForm">
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Proceed</button>
            </form>
            <p class="mt-3 text-center">
                <a href="#" onclick="toggleAuth()" class="text-accent text-decoration-none">Switch to Register</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
